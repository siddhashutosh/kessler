name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run tests (demo mode enforced)
        run: python -m pytest backend/tests -q
        working-directory: .
        env:
          PYTHONPATH: backend

  toolkit-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify package is in sync with backend logic
        run: python packages/sync.py --check
      - name: Build wheel
        run: |
          pip install build
          python -m build packages/kessler-toolkit
      - name: Smoke-test install
        run: |
          pip install packages/kessler-toolkit/dist/*.whl
          python -c "from kessler_toolkit import pc_foster, parse_cdm_kvn; print('toolkit ok')"

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build UI (type-check + bundle)
        run: |
          npm ci --prefix ui
          npm run build --prefix ui
