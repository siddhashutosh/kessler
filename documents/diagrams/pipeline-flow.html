<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KESSLER — Agent Pipeline (n8n-style flow)</title>
<style>
  :root {
    --bg: #0a0e17;
    --grid: rgba(96, 125, 190, 0.07);
    --node-bg: #131a2b;
    --node-border: #26314e;
    --node-border-hot: #59d8ff;
    --text: #dce6f7;
    --sub: #8291b0;
    --cyan: #59d8ff;
    --green: #3ddc84;
    --amber: #ffb454;
    --red: #ff5d5d;
    --violet: #a78bfa;
    --wire: #33415e;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(1200px 600px at 70% -10%, rgba(53, 92, 170, 0.16), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }
  #canvas {
    position: relative;
    width: 1520px; height: 760px;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
    transform-origin: 0 0;
  }
  #viewport { width: 100%; height: 100%; overflow: hidden; cursor: grab; }
  #viewport.dragging { cursor: grabbing; }

  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 30;
    display: flex; align-items: baseline; gap: 14px;
    padding: 14px 22px;
    background: linear-gradient(rgba(10,14,23,0.95), rgba(10,14,23,0.6) 80%, transparent);
    pointer-events: none;
  }
  header h1 { font-size: 15px; letter-spacing: 4px; font-weight: 700; }
  header h1 span { color: var(--cyan); }
  header p { font-size: 12px; color: var(--sub); }

  svg#wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .wire { fill: none; stroke: var(--wire); stroke-width: 2; }
  .wire-flow {
    fill: none; stroke-width: 2.5; stroke-linecap: round;
    stroke-dasharray: 6 14; animation: flow 1.1s linear infinite;
  }
  @keyframes flow { to { stroke-dashoffset: -20; } }

  .node {
    position: absolute; width: 218px;
    background: var(--node-bg);
    border: 1px solid var(--node-border);
    border-radius: 10px;
    padding: 12px 14px 10px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
    transition: border-color .2s, transform .2s, box-shadow .2s;
  }
  .node:hover { transform: translateY(-2px); border-color: var(--node-border-hot); box-shadow: 0 10px 30px rgba(89,216,255,.12); }
  .node .head { display: flex; align-items: center; gap: 9px; }
  .node .icon {
    width: 30px; height: 30px; border-radius: 8px; flex: 0 0 30px;
    display: grid; place-items: center; font-size: 15px;
    background: rgba(89, 216, 255, 0.12);
  }
  .node .title { font-size: 13px; font-weight: 600; letter-spacing: .3px; }
  .node .kind { font-size: 10px; color: var(--sub); text-transform: uppercase; letter-spacing: 1.2px; }
  .node .desc { font-size: 11px; color: var(--sub); margin-top: 8px; line-height: 1.45; }
  .node .meta {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 9px; padding-top: 8px; border-top: 1px solid rgba(56, 70, 105, 0.5);
    font-size: 10.5px; color: var(--sub);
  }
  .node .status { display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sub); }
  .node[data-status="ok"]       .dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .node[data-status="running"]  .dot { background: var(--cyan);  box-shadow: 0 0 8px var(--cyan); animation: pulse 1s infinite; }
  .node[data-status="degraded"] .dot { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
  .node[data-status="error"]    .dot { background: var(--red);   box-shadow: 0 0 8px var(--red); }
  @keyframes pulse { 50% { opacity: .35; } }

  .node.src   { border-left: 3px solid var(--violet); }
  .node.agent { border-left: 3px solid var(--cyan); }
  .node.out   { border-left: 3px solid var(--green); }
  .node.src .icon   { background: rgba(167, 139, 250, 0.14); }
  .node.out .icon   { background: rgba(61, 220, 132, 0.13); }

  .port { position: absolute; width: 10px; height: 10px; border-radius: 50%;
          background: var(--bg); border: 2px solid var(--wire); top: 50%; margin-top: -5px; }
  .port.in  { left: -6px; } .port.out { right: -6px; }

  .group-label {
    position: absolute; font-size: 10px; letter-spacing: 2.5px; color: var(--sub);
    text-transform: uppercase; opacity: .85;
  }
  .legend {
    position: fixed; bottom: 14px; left: 18px; z-index: 30;
    display: flex; gap: 16px; font-size: 11px; color: var(--sub);
    background: rgba(13, 18, 32, 0.85); border: 1px solid var(--node-border);
    padding: 8px 14px; border-radius: 8px; backdrop-filter: blur(4px);
  }
  .legend .dot { display: inline-block; vertical-align: middle; margin-right: 5px; }
  .hint { position: fixed; bottom: 14px; right: 18px; z-index: 30; font-size: 11px; color: var(--sub); }
</style>
</head>
<body>
<header>
  <h1>KESSLER<span> · AGENT PIPELINE</span></h1>
  <p>Conjunction-assessment data flow — KSL-DIA-001 · drag to pan, wheel to zoom</p>
</header>

<div id="viewport"><div id="canvas">
  <svg id="wires"></svg>
</div></div>

<div class="legend">
  <span><span class="dot" style="background:var(--green)"></span>ok</span>
  <span><span class="dot" style="background:var(--cyan)"></span>running</span>
  <span><span class="dot" style="background:var(--amber)"></span>degraded</span>
  <span><span class="dot" style="background:var(--red)"></span>error</span>
  <span><span class="dot" style="background:var(--sub)"></span>idle</span>
</div>
<div class="hint">Live status via postMessage from KESSLER UI · standalone = demo animation</div>

<script>
(function () {
  const NODES = [
    { id: "celestrak",  cls: "src",   x: 40,   y: 150, icon: "🛰️", kind: "data source",
      title: "CelesTrak GP",        desc: "OMM catalogue (JSON), no auth. Hourly TTL.", meta: "gp.php · GROUP=active" },
    { id: "spacetrack", cls: "src",   x: 40,   y: 470, icon: "📡", kind: "data source",
      title: "Space-Track CDM",     desc: "cdm_public batches. Throttled &lt;20/min, cache-first.", meta: "class/cdm_public" },
    { id: "catalog",    cls: "agent", x: 340,  y: 150, icon: "🗂️", kind: "agent 01",
      title: "Catalog Sync",        desc: "Fetch → validate → SQLite cache. Last-known-good fallback.", meta: "hourly" },
    { id: "ingest",     cls: "agent", x: 340,  y: 470, icon: "⬇️", kind: "agent 02",
      title: "CDM Ingest",          desc: "Pull latest conjunction batch (live or demo dataset).", meta: "every 30 min" },
    { id: "parser",     cls: "agent", x: 640,  y: 310, icon: "🧪", kind: "agent 03",
      title: "Parser & Validator",  desc: "CCSDS KVN / JSON → typed CDM. Invalid records quarantined.", meta: "CdmParseError → quarantine" },
    { id: "pc",         cls: "agent", x: 940,  y: 190, icon: "∬", kind: "agent 04",
      title: "Pc Engine",           desc: "Foster 2D integration + Chan series cross-check, or Max-Pc.", meta: "divergence &gt; 5% flagged" },
    { id: "risk",       cls: "agent", x: 940,  y: 430, icon: "⚖️", kind: "agent 05",
      title: "Risk Analyst",        desc: "Class (CRITICAL→NEGLIGIBLE), urgency 0-100, action text, AI briefing.", meta: "thresholds 1e-4 / 1e-5 / 1e-7" },
    { id: "publish",    cls: "agent", x: 1240, y: 310, icon: "🚀", kind: "agent 06",
      title: "Publisher",           desc: "Snapshot to events store, served via REST /api/v1.", meta: "SQLite read-model" },
    { id: "ui",         cls: "out",   x: 1240, y: 80,  icon: "🌍", kind: "consumer",
      title: "3D Dashboard",        desc: "Orbit view, event list, this diagram — live.", meta: "React + Three.js" },
    { id: "api",        cls: "out",   x: 1240, y: 560, icon: "{}", kind: "consumer",
      title: "REST / OpenAPI",      desc: "Typed JSON for integrators; error envelope contract.", meta: "/docs" },
  ];

  const EDGES = [
    ["celestrak", "catalog", "cyan"],
    ["spacetrack", "ingest", "cyan"],
    ["catalog", "parser", "cyan"],
    ["ingest", "parser", "cyan"],
    ["parser", "pc", "cyan"],
    ["parser", "risk", "cyan"],
    ["pc", "risk", "cyan"],
    ["pc", "publish", "cyan"],
    ["risk", "publish", "cyan"],
    ["publish", "ui", "green"],
    ["publish", "api", "green"],
  ];
  const COLOR = { cyan: "#59d8ff", green: "#3ddc84" };
  const NODE_W = 218;

  const canvas = document.getElementById("canvas");
  const svg = document.getElementById("wires");

  for (const n of NODES) {
    const el = document.createElement("div");
    el.className = "node " + n.cls;
    el.id = "node-" + n.id;
    el.style.left = n.x + "px";
    el.style.top = n.y + "px";
    el.dataset.status = "idle";
    el.innerHTML =
      '<div class="head"><div class="icon">' + n.icon + '</div><div>' +
      '<div class="kind">' + n.kind + '</div><div class="title">' + n.title + '</div></div></div>' +
      '<div class="desc">' + n.desc + '</div>' +
      '<div class="meta"><span>' + n.meta + '</span>' +
      '<span class="status"><span class="dot"></span><span class="stxt">idle</span></span></div>' +
      '<span class="port in"></span><span class="port out"></span>';
    canvas.appendChild(el);
  }

  function center(n, side) {
    const el = document.getElementById("node-" + n.id);
    const h = el.offsetHeight;
    return { x: n.x + (side === "out" ? NODE_W : 0), y: n.y + h / 2 };
  }
  function draw() {
    svg.innerHTML = "";
    const byId = Object.fromEntries(NODES.map(n => [n.id, n]));
    for (const [a, b, c] of EDGES) {
      const p1 = center(byId[a], "out"), p2 = center(byId[b], "in");
      const dx = Math.max(60, (p2.x - p1.x) / 2);
      const d = `M ${p1.x} ${p1.y} C ${p1.x + dx} ${p1.y}, ${p2.x - dx} ${p2.y}, ${p2.x} ${p2.y}`;
      const base = document.createElementNS("http://www.w3.org/2000/svg", "path");
      base.setAttribute("d", d); base.setAttribute("class", "wire");
      svg.appendChild(base);
      const flow = document.createElementNS("http://www.w3.org/2000/svg", "path");
      flow.setAttribute("d", d); flow.setAttribute("class", "wire-flow");
      flow.setAttribute("stroke", COLOR[c]); flow.setAttribute("opacity", "0.85");
      svg.appendChild(flow);
    }
  }
  draw();

  function setStatus(id, status, text) {
    const el = document.getElementById("node-" + id);
    if (!el) return;
    el.dataset.status = status;
    el.querySelector(".stxt").textContent = text || status;
  }

  // ---- live mode: KESSLER UI posts {type:"kessler:pipeline", agents:[{id,status,detail}]}
  let live = false;
  window.addEventListener("message", (ev) => {
    const msg = ev.data;
    if (!msg || msg.type !== "kessler:pipeline" || !Array.isArray(msg.agents)) return;
    live = true;
    for (const a of msg.agents) setStatus(a.id, a.status, a.detail);
  });

  // ---- standalone demo animation (runs until a live message arrives)
  const SEQ = ["celestrak", "spacetrack", "catalog", "ingest", "parser", "pc", "risk", "publish", "ui", "api"];
  let i = 0;
  setInterval(() => {
    if (live) return;
    const id = SEQ[i % SEQ.length];
    setStatus(id, "running", "running");
    setTimeout(() => { if (!live) setStatus(id, "ok", "ok"); }, 900);
    i++;
  }, 700);

  // ---- pan & zoom
  const vp = document.getElementById("viewport");
  let scale = 1, ox = 0, oy = 0, drag = null;
  function apply() { canvas.style.transform = `translate(${ox}px, ${oy}px) scale(${scale})`; }
  function fit() {
    scale = Math.min(window.innerWidth / 1560, window.innerHeight / 800, 1.15);
    ox = (window.innerWidth - 1520 * scale) / 2;
    oy = Math.max(30, (window.innerHeight - 760 * scale) / 2);
    apply();
  }
  vp.addEventListener("mousedown", e => { drag = { x: e.clientX - ox, y: e.clientY - oy }; vp.classList.add("dragging"); });
  window.addEventListener("mousemove", e => { if (drag) { ox = e.clientX - drag.x; oy = e.clientY - drag.y; apply(); } });
  window.addEventListener("mouseup", () => { drag = null; vp.classList.remove("dragging"); });
  vp.addEventListener("wheel", e => {
    e.preventDefault();
    const k = e.deltaY < 0 ? 1.1 : 0.9;
    scale = Math.min(2.2, Math.max(0.4, scale * k));
    apply();
  }, { passive: false });
  window.addEventListener("resize", fit);
  fit();
})();
</script>
</body>
</html>
